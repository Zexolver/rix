[package]
name = "rix-cli"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "rix"
path = "src/bin/rix.rs"

[[bin]]
name = "rix-tui"
path = "src/bin/rix-tui.rs"

[[bin]]
name = "rix-gui"
path = "src/bin/rix-gui.rs"

[dependencies]
rix-core = { path = "../rix-core" }
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.18.4"
regex = "1.10"
libc = "0.2.186"

ratatui = { version = "0.28", features = ["serde"] }
crossterm = { version = "0.28", features = ["events"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# Slint GUI framework (GPL-licensed, cross-platform)
slint = { version = "1.7", features = ["backend-qt", "backend-winit"] }
slint-build = { version = "1.7", optional = true }

[build-dependencies]
slint-build = "1.7"
