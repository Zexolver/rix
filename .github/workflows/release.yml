name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy rix binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/rix.exe artifacts/rix-${{ matrix.artifact_suffix }}
            cp target/${{ matrix.target }}/release/rix-tui.exe artifacts/rix-tui-${{ matrix.artifact_suffix }}
          else
            cp target/${{ matrix.target }}/release/rix artifacts/rix-${{ matrix.artifact_suffix }}
            cp target/${{ matrix.target }}/release/rix-tui artifacts/rix-tui-${{ matrix.artifact_suffix }}
          fi

      - name: Strip binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          strip artifacts/rix-* || true

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*

  build-matrix:
    name: Verify build on all platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --lib

      - name: Build all binaries
        run: cargo build --release --bins

  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    if: contains(github.ref, 'beta') || contains(github.ref, 'Reconstruct')
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64
          - target: i686-linux-android
            arch: x86

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        uses: ndk-build/ndk-build@v1.6
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android binary
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cargo ndk -t ${{ matrix.arch }} -o ./android-build build --release --bin rix-gui

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy binary
        run: |
          cp ./android-build/${{ matrix.arch }}/release/rix-gui artifacts/rix-gui-android-${{ matrix.arch }}

      - name: Strip binary
        run: |
          strip artifacts/rix-gui-android-${{ matrix.arch }} || true

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref, 'beta') }}
