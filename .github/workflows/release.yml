name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy rix binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/rix.exe artifacts/rix-${{ matrix.artifact_suffix }}
            cp target/${{ matrix.target }}/release/rix-tui.exe artifacts/rix-tui-${{ matrix.artifact_suffix }}
          else
            cp target/${{ matrix.target }}/release/rix artifacts/rix-${{ matrix.artifact_suffix }}
            cp target/${{ matrix.target }}/release/rix-tui artifacts/rix-tui-${{ matrix.artifact_suffix }}
          fi

      - name: Strip binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          strip artifacts/rix-* || true

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*

  build-matrix:
    name: Verify build on all platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --lib

      - name: Build all binaries
        run: cargo build --release --bins
