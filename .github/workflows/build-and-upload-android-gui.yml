name: Build and Upload Android GUI

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release ID to upload to (e.g., 362640062)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android-gui:
    name: Build Android GUI and Upload
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64
          - target: i686-linux-android
            arch: x86

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-slint-android

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        uses: ndk-build/ndk-build@v1.6
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android GUI binary
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cargo ndk -t ${{ matrix.arch }} -o ./android-build build --release -p rix-cli --bin rix-gui

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy binary
        run: |
          cp ./android-build/${{ matrix.arch }}/release/rix-gui artifacts/rix-gui-android-${{ matrix.arch }}

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip artifacts/rix-gui-android-${{ matrix.arch }} || strip artifacts/rix-gui-android-${{ matrix.arch }} || true

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in artifacts/*; do
            echo "Uploading $(basename $file)..."
            curl -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ inputs.release_id }}/assets?name=$(basename $file)"
          done
