name: Android Build

on:
  push:
    tags:
      - 'v*-beta*'
      - 'Reconstruct Raven*'
    branches:
      - claude-slint-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
            ndk_target: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
            ndk_target: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64
            ndk_target: x86_64
          - target: i686-linux-android
            arch: x86
            ndk_target: x86

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        uses: ndk-build/ndk-build@v1.6
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android binary
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cargo ndk -t ${{ matrix.arch }} -o ./android-build build --release --bin rix-gui

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy binary
        run: |
          cp ./android-build/${{ matrix.arch }}/release/rix-gui artifacts/rix-gui-android-${{ matrix.arch }}

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref, 'beta') }}

  create-beta-release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'beta')
    needs: build-android
    steps:
      - uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: release_notes
        run: |
          echo "notes=🚀 Rix Android Beta Release - ${{ steps.tag.outputs.name }}" >> $GITHUB_OUTPUT
          echo "Android APKs and binaries available for download." >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: |
            # Rix Android Beta Release

            This release includes Android APK binaries for the Rix package manager.

            ## Supported Architectures
            - **ARM64** (aarch64-linux-android) - Most modern Android devices
            - **ARMv7** (armv7-linux-androideabi) - Older Android devices
            - **x86_64** - Android emulators and x86 tablets
            - **x86** - Older x86 Android devices

            ## Installation
            1. Download the appropriate binary for your device architecture
            2. Transfer to your Android device (e.g., via nix-on-droid)
            3. Make executable: `chmod +x rix-gui-android-*`
            4. Run: `./rix-gui-android-arm64-v8a`

            ## Testing with nix-on-droid
            ```bash
            nix-on-droid shell
            # Transfer the binary to your device
            chmod +x rix-gui-android-arm64-v8a
            ./rix-gui-android-arm64-v8a
            ```

            ## Notes
            - This is a beta release for testing purposes
            - Full APK packaging coming in future releases
            - Feedback appreciated for production release

            ---
            Generated by [Claude Code](https://claude.ai/code)
          prerelease: true
